
################
### MONITORS ###
################

# I don't understand the way of configuring monitors positions etc..
# so use (https://github.com/nwg-piotr/nwg-displays) as a cheat seet :)
# NOTE: requires "wlr-randr" pkg
# list available Monitors with "hyprctl monitors"
# monitor=name,resolution,position,scale

monitor=eDP-1,2880x1920@60,0x0,1.5


###################
### MY PROGRAMS ###
###################

$term = foot
$termFloat = foot --app-id=term-float
$fileManager = thunar
$menu = rofi -modes drun -show drun
$calc = rofi -modes calc -show calc
$browser = flatpak run io.gitlab.librewolf-community
$browserPrivate = flatpak run io.gitlab.librewolf-community --private-window


#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

exec-once = systemctl --user start hyprpolkitagent

exec-once = hyprctl setcursor Banana 24

exec-once = waybar
exec-once = swww-daemon
exec-once = systemctl --user start swww-random.timer
exec-once = hypridle

exec-once = wl-paste --watch cliphist store


#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hyprland.org/Configuring/Environment-variables/

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24


#####################
### LOOK AND FEEL ###
#####################

# Color scheme (https://github.com/catppuccin/hyprland)
source = ~/.config/hypr/mocha.conf

# Refer to https://wiki.hyprland.org/Configuring/Variables/

# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    gaps_in = 5
    gaps_out = 10

    border_size = 2

    # https://wiki.hyprland.org/Configuring/Variables/#variable-types for info about colors
    col.active_border = $mauve $pink 45deg
    col.inactive_border = rgba($surface0Alphaee)

	no_focus_fallback = true

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = false

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = dwindle
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    rounding = 0
    rounding_power = 2

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba($crustAlpha77)
    }

    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 3
        passes = 1

        vibrancy = 0.1696
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    enabled = yes, please :)

    # Default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1

    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 4.79, easeOutQuint
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces, 1, 1.94, almostLinear, fade
    animation = workspacesIn, 1, 1.21, almostLinear, fade
    animation = workspacesOut, 1, 1.94, almostLinear, fade
}

# Ref https://wiki.hyprland.org/Configuring/Workspace-Rules/
# "Smart gaps" / "No gaps when only"
# uncomment all if you wish to use that.
# workspace = w[tv1], gapsout:0, gapsin:0
# workspace = f[1], gapsout:0, gapsin:0
# windowrulev2 = bordersize 0, floating:0, onworkspace:w[tv1]
# windowrulev2 = rounding 0, floating:0, onworkspace:w[tv1]
# windowrulev2 = bordersize 0, floating:0, onworkspace:f[1]
# windowrulev2 = rounding 0, floating:0, onworkspace:f[1]

# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}

# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc {
    force_default_wallpaper = 0 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = false # If true disables the random hyprland logo / anime girl background. :(
	focus_on_activate = true
}

xwayland {
	force_zero_scaling = true
}

group {
	drag_into_group = 2
	merge_groups_on_drag = false

    col.border_active = $mauve $pink 45deg
    col.border_inactive = rgba($surface0Alphaee)

	groupbar {
		render_titles = false
		indicator_height = 4
		rounding = 0
		round_only_edges = false

		gaps_in = 5
		gaps_out = 0

		col.active = $mauve
		col.inactive = rgba($surface0Alphaee)
	}
}

#############
### INPUT ###
#############

# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout = fr
    kb_variant = us
    kb_model =
    kb_options = caps:escape_shifted_capslock
    kb_rules =

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
		disable_while_typing = false
        natural_scroll = true
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#gestures
gestures {
    workspace_swipe = true
}

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}


###################
### KEYBINDINGS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

bind = $mainMod, Escape, exec, hyprlock

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, Return, exec, $term
bind = $mainMod SHIFT, Return, exec, $termFloat
bind = $mainMod, B, exec, $browser
bind = $mainMod SHIFT, B, exec, $browserPrivate
bind = $mainMod SHIFT, Q, killactive,
bind = ALT, F4, killactive,
bind = $mainMod SHIFT, M, exit,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, Space, togglefloating,
bind = $mainMod, D, exec, $menu
bind = $mainMod, C, exec, rofi -modes calc -show calc
bind = $mainMod, v, exec, rofi -modi clipboard:~/.local/bin/cliphist-rofi-img -show clipboard -show-icons
bind = $mainMod ALT, B, exec, rofi-bluetooth
bind = $mainMod ALT, W, exec, rofi-wifi-menu

bind = $mainMod, F, fullscreenstate, 2 2
bind = $mainMod SHIFT, F, fullscreenstate, 0 2
bind = $mainMod ALT, F, fullscreenstate, 2 0

bind = $mainMod, G, togglegroup,
bind = $mainMod, Tab, changegroupactive, f
bind = $mainMod SHIFT, Tab, changegroupactive, b

# Move focus with mainMod + arrow keys
bind = $mainMod, H, movefocus, l
bind = $mainMod, J, movefocus, d
bind = $mainMod, K, movefocus, u
bind = $mainMod, L, movefocus, r

bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, J, movewindow, d
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, L, movewindow, r

bind = $mainMod ALT, H, movewindoworgroup, l
bind = $mainMod ALT, J, movewindoworgroup, d
bind = $mainMod ALT, K, movewindoworgroup, u
bind = $mainMod ALT, L, movewindoworgroup, r

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9

bind = $mainMod, comma, workspace, -1
bind = $mainMod, period, workspace, +1

bind = $mainMod SHIFT, comma, movetoworkspace, -1
bind = $mainMod SHIFT, period, movetoworkspace, +1

# Example special workspace (scratchpad)
bind = $mainMod, 0, togglespecialworkspace, scratchpad1
bind = $mainMod, minus, togglespecialworkspace, scratchpad2
bind = $mainMod, equal, togglespecialworkspace, scratchpad3

bind = $mainMod SHIFT, 0, movetoworkspace, special:scratchpad1
bind = $mainMod SHIFT, minus, movetoworkspace, special:scratchpad2
bind = $mainMod SHIFT, equal, movetoworkspace, special:scratchpad3

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, -1
bind = $mainMod, mouse_up, workspace, +1

bind = $mainMod SHIFT, mouse_down, movetoworkspace, -1
bind = $mainMod SHIFT, mouse_up, movetoworkspace, +1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
bindm = $mainMod SHIFT, mouse:272, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 5%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = SHIFT, XF86AudioNext, exec, playerctld shift
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous
bindl = SHIFT, XF86AudioPrev, exec, playerctld unshift

binde = $mainMod ALT, equal, exec, ~/.local/bin/hyprzoom +.5
binde = $mainMod ALT, minus, exec, ~/.local/bin/hyprzoom -.5
bind = $mainMod ALT, 0, exec, ~/.local/bin/hyprzoom reset

bind = , PRINT, exec, hyprshot -m region -z --raw | satty -o "$HOME/Pictures/screenshots/%Y-%m-%d_%H-%M-%S.png" --save-after-copy --early-exit --disable-notifications --filename -
bind = $mainMod, PRINT, exec, hyprshot -m window -z --raw | satty -o "$HOME/Pictures/screenshots/%Y-%m-%d_%H-%M-%S.png" --save-after-copy --early-exit --disable-notifications --filename -
bind = $mainMod SHIFT, PRINT, exec, hyprshot -m active -m output -z --raw | satty -o "$HOME/Pictures/screenshots/%Y-%m-%d_%H-%M-%S.png" --save-after-copy --early-exit --disable-notifications --filename -

bind = $mainMod ALT, PRINT, exec, hyprpicker -a -n -r

##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

# Example windowrule v1
# windowrule = float, ^(kitty)$

# Example windowrule v2
# windowrulev2 = float,class:^(kitty)$,title:^(kitty)$

# Ignore maximize requests from apps. You'll probably like this.
windowrulev2 = suppressevent maximize, class:.*

# Fix some dragging issues with XWayland
windowrulev2 = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0

windowrulev2 = rounding 5, floating:1

windowrulev2 = float, title:^Picture-in-Picture$, class:^LibreWolf$
windowrulev2 = pin, title:^Picture-in-Picture$, class:^LibreWolf$
windowrulev2 = size 640 360, title:^Picture-in-Picture$, class:^LibreWolf$
windowrulev2 = center 1, title:^Picture-in-Picture$, class:^LibreWolf$
windowrulev2 = rounding 0, title:^Picture-in-Picture$, class:^LibreWolf$
windowrulev2 = noborder, title:^Picture-in-Picture$, class:^LibreWolf$
windowrulev2 = keepaspectratio, title:^Picture-in-Picture$, class:^LibreWolf$
windowrulev2 = opaque, title:^Picture-in-Picture$, class:^LibreWolf$
windowrulev2 = noinitialfocus, title:^Picture-in-Picture$, class:^LibreWolf$

windowrulev2 = float, class:^term-float$
windowrulev2 = size 960 540, class:^term-float$
windowrulev2 = center, class:^term-float$

windowrulev2 = opacity 0.95, class:^LibreWolf$, floating:0, fullscreen:0

windowrulev2 = stayfocused, class:^Pinentry-gtk$
windowrulev2 = float, class:^Pinentry-gtk$
windowrulev2 = pin, class:^Pinentry-gtk$

windowrulev2 = tile, class:^Aseprite$
